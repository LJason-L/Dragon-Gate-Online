<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP 射龍門 🐉 頂級線上俱樂部</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@600;800&family=Noto+Sans+TC:wght@400;700;900&display=swap" rel="stylesheet">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>🐉</text></svg>">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --gold: #F5D061; 
            --gold-dark: #C99E38;
            --gold-glow: rgba(245, 208, 97, 0.5);
            --bg-dark: #0a0a0a;
            --panel-bg: rgba(20, 20, 25, 0.85);
            --glass-border: rgba(255, 215, 0, 0.15);
            --win-green: #00E676;
            --lose-red: #FF3366;
            --table-green: radial-gradient(ellipse at center, #104A2D 0%, #061F12 100%);
        }
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Noto Sans TC', sans-serif; margin: 0; 
            background-color: var(--bg-dark);
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(201, 158, 56, 0.08), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(201, 158, 56, 0.08), transparent 25%);
            display: flex; height: 100vh; color: #f8fafc; position: relative; overflow: hidden;
        }
        
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(25px);
            -webkit-backdrop-filter: blur(25px);
            border: 1px solid var(--glass-border);
            border-radius: 20px;
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.8), inset 0 1px 1px rgba(255,255,255,0.05);
            padding: 40px;
        }

        .overlay-screen { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: rgba(5,5,5,0.95); z-index: 1000; display: flex; flex-direction: column; 
            align-items: center; justify-content: center; overflow-y: auto; padding: 20px 0;
        }
        
        h1.title-gold { 
            font-family: 'Cinzel', serif; font-size: 3.5em; color: transparent; 
            background: linear-gradient(to bottom, #FFF3A1 0%, #D4AF37 100%); 
            -webkit-background-clip: text; background-clip: text; 
            text-shadow: 0 5px 25px var(--gold-glow); margin-bottom: 25px; letter-spacing: 5px; font-weight: 800; text-align: center;
        }
        
        .input-group label { display: block; color: #A0A0A0; margin-bottom: 10px; font-size: 0.95em; font-weight: 700; letter-spacing: 1.5px;}
        input[type="text"], input[type="number"] { 
            width: 100%; padding: 18px; font-size: 1.3em; border-radius: 12px; 
            border: 1px solid rgba(255,215,0,0.3); background: rgba(0,0,0,0.6); color: var(--gold); 
            outline: none; transition: all 0.3s ease; text-align: center; font-weight: 700; box-shadow: inset 0 2px 10px rgba(0,0,0,0.5);
        }
        input:focus { border-color: var(--gold); box-shadow: inset 0 2px 10px rgba(0,0,0,0.5), 0 0 20px var(--gold-glow); background: rgba(0,0,0,0.8);}
        
        button { 
            width: 100%; padding: 16px; font-size: 1.3em; border-radius: 12px; font-weight: 900; 
            border: 1px solid rgba(255,255,255,0.2); cursor: pointer; transition: all 0.2s cubic-bezier(0.25, 0.8, 0.25, 1); letter-spacing: 2px;
        }
        .btn-primary { 
            background: linear-gradient(to bottom, #FFDF73 0%, #C99E38 100%); color: #111; 
            box-shadow: 0 8px 20px rgba(201,158,56,0.4), inset 0 2px 2px rgba(255,255,255,0.8); text-transform: uppercase;
        }
        .btn-primary:active { transform: translateY(4px); box-shadow: 0 2px 5px rgba(201,158,56,0.4), inset 0 1px 1px rgba(255,255,255,0.8); }
        
        .btn-secondary { 
            background: linear-gradient(to bottom, #3b82f6 0%, #1d4ed8 100%); color: white; 
            box-shadow: 0 8px 20px rgba(37,99,235,0.4), inset 0 2px 2px rgba(255,255,255,0.4); 
        }
        .btn-secondary:active { transform: translateY(4px); box-shadow: 0 2px 5px rgba(37,99,235,0.4); }

        .divider-text { color: #666; font-size: 0.9em; margin: 25px 0; position: relative; display: flex; align-items: center; justify-content: center; font-weight: bold;}
        .divider-text::before, .divider-text::after { content: ""; flex: 1; height: 1px; background: rgba(255,255,255,0.1); margin: 0 15px; }

        .sidebar { 
            width: 320px; background: rgba(15,15,15,0.9); border-right: 1px solid rgba(255,215,0,0.15); 
            padding: 25px; display: flex; flex-direction: column; box-shadow: 10px 0 30px rgba(0,0,0,0.8); z-index: 10;
        }
        .room-tag { 
            background: linear-gradient(135deg, rgba(201,158,56,0.1) 0%, transparent 100%); 
            border: 1px solid var(--gold-dark); color: #FFF; padding: 12px; border-radius: 12px; 
            font-size: 1.1em; text-align: center; margin-bottom: 25px; font-weight: 700; letter-spacing: 1px;
        }
        .room-tag span { color: var(--gold); font-family: 'Cinzel', serif; font-size: 1.3em; letter-spacing: 4px;}
        
        .player-list { flex-grow: 1; overflow-y: auto; padding-right: 5px; }
        .player-item { 
            display: flex; align-items: center; justify-content: space-between; padding: 16px 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.1em; font-weight: 700; transition: 0.3s; border-radius: 8px; margin-bottom: 5px; background: rgba(255,255,255,0.02);
        }
        .active-turn { background: linear-gradient(90deg, rgba(201,158,56,0.2) 0%, transparent 100%); border-left: 4px solid var(--gold); border-bottom: none; box-shadow: 0 4px 10px rgba(0,0,0,0.3);}
        .pnl-positive { color: var(--win-green); text-shadow: 0 0 10px rgba(0,230,118,0.4); }
        .pnl-negative { color: var(--lose-red); text-shadow: 0 0 10px rgba(255,51,102,0.4); }

        .main-game { flex-grow: 1; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative;}
        
        .top-action-bar { position: absolute; top: 20px; right: 30px; display: flex; gap: 15px; z-index: 50; }
        .top-btn { 
            background: rgba(0,0,0,0.6); border: 1px solid rgba(255,255,255,0.2); color: #ccc; padding: 10px 20px; 
            border-radius: 30px; font-size: 0.9em; cursor: pointer; transition: 0.3s; font-weight: bold;
        }
        .top-btn:hover { background: rgba(255,255,255,0.1); color: white; border-color: white;}
        
        .casino-table { 
            width: 100%; max-width: 1100px; flex-grow: 1; margin-top: 50px;
            background: var(--table-green);
            background-image: radial-gradient(rgba(255,255,255,0.03) 1px, transparent 1px); background-size: 10px 10px;
            border-radius: 200px; 
            box-shadow: inset 0 0 80px rgba(0,0,0,0.9), 0 20px 50px rgba(0,0,0,0.7), 0 0 0 15px #3A2318, 0 0 0 18px #1A0F0A; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 40px;
        }
        
        .table-info { display: flex; gap: 60px; position: absolute; top: 70px; width: 100%; justify-content: center;}
        .info-box { text-align: center; background: rgba(0,0,0,0.4); padding: 10px 30px; border-radius: 20px; border: 1px solid rgba(0,0,0,0.5); box-shadow: inset 0 2px 5px rgba(255,255,255,0.05);}
        .info-label { color: var(--gold-dark); font-size: 0.85em; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px; font-weight: bold;}
        .info-val { font-family: 'Cinzel', serif; font-size: 3.5em; color: var(--gold); font-weight: 800; text-shadow: 0 5px 15px rgba(0,0,0,0.8); line-height: 1;}
        
        .center-board { display: flex; justify-content: center; gap: 30px; perspective: 1200px; margin-top: 40px;}
        .card { width: 140px; height: 200px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.34, 1.56, 0.64, 1); border-radius: 12px; box-shadow: -10px 15px 30px rgba(0,0,0,0.6); }
        .card.flipped { transform: rotateY(180deg) scale(1.05); box-shadow: -15px 25px 40px rgba(0,0,0,0.7);}
        .card-face { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 12px; }
        .card-back { 
            background: repeating-linear-gradient(45deg, #8b0000, #8b0000 10px, #b22222 10px, #b22222 20px); 
            border: 6px solid white; transform: rotateY(0deg); box-shadow: inset 0 0 15px rgba(0,0,0,0.5);
        }
        .card-front { 
            transform: rotateY(180deg); background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); 
            border: 1px solid #ccc; color: #111; display: flex; flex-direction: column; padding: 10px;
        }
        .red-suit { color: #D32F2F; }
        .card-corner { position: absolute; top: 8px; left: 10px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .card-corner-val { font-size: 32px; font-weight: 900; font-family: 'Cinzel', serif;}
        .card-corner-suit { font-size: 22px; margin-top: 2px; }
        .card-suit { font-size: 70px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.95;}

        .bottom-panel { 
            width: 100%; max-width: 800px; background: linear-gradient(to top, rgba(15,15,15,0.95) 0%, rgba(30,30,30,0.85) 100%); 
            border: 1px solid #333; border-top: 1px solid #555; border-radius: 24px; padding: 30px; text-align: center; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.6); z-index: 20;
        }
        #resultMsg { font-size: 1.8em; font-weight: 800; margin-bottom: 25px; letter-spacing: 1.5px; text-shadow: 0 2px 10px rgba(0,0,0,0.8);}
        .controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
        
        .action-input { 
            width: 220px; padding: 15px; font-size: 1.6em; border-radius: 12px; border: 2px solid var(--gold-dark); 
            background: #000; color: var(--gold); text-align: center; font-weight: bold; outline: none; box-shadow: inset 0 2px 10px rgba(0,0,0,0.8);
            margin: 0; height: 60px;
        }
        .action-input:focus { border-color: var(--gold); box-shadow: inset 0 2px 10px rgba(0,0,0,0.8), 0 0 20px var(--gold-glow); }
        
        #actionArea button {
            min-width: 180px; 
            height: 60px; 
            display: flex; justify-content: center; align-items: center; font-size: 1.2em; white-space: nowrap; margin: 0; padding: 0 20px;
        }
        
        .btn-shoot { background: linear-gradient(to bottom, #2ECC71 0%, #00C853 100%); color: #000; box-shadow: 0 8px 20px rgba(0,200,83,0.3), inset 0 2px 2px rgba(255,255,255,0.6);}
        .btn-pass { background: linear-gradient(to bottom, #94A3B8 0%, #64748B 100%); color: white; box-shadow: 0 8px 20px rgba(100,116,139,0.3), inset 0 2px 2px rgba(255,255,255,0.4);}

        #shuffleOverlay { position: absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.92); z-index:4000; display:none; flex-direction:column; justify-content:center; align-items:center; backdrop-filter: blur(10px);}
        .shuffle-icon { font-size: 8em; animation: float 2s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(255,215,0,0.3));}
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(10deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .glass-panel { width: 92%; padding: 30px 20px; border-radius: 20px;}
            h1.title-gold { font-size: 2.8em; letter-spacing: 2px; }
            input[type="text"], input[type="number"], button { font-size: 1.1em; padding: 14px;}
            
            .top-action-bar { top: 10px; right: 10px; left: 10px; justify-content: space-between; gap: 5px; }
            .top-btn { padding: 8px 12px; font-size: 0.85em; border-radius: 8px;}

            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid rgba(255,215,0,0.2); padding: 15px; margin-top: 50px; box-shadow: 0 5px 20px rgba(0,0,0,0.5);}
            .room-tag { margin-bottom: 10px; padding: 10px; font-size: 1em; }
            .player-list { max-height: 180px; display: flex; flex-direction: column; gap: 5px;}
            .player-item { font-size: 1em; padding: 12px 15px; }
            
            .main-game { padding: 10px; justify-content: flex-start; min-height: 60vh;}
            .casino-table { border-radius: 40px; padding: 15px; margin-top: 15px; height: 360px; box-shadow: inset 0 0 50px rgba(0,0,0,0.9), 0 0 0 10px #3A2318;}
            .table-info { top: 25px; gap: 20px; }
            .info-val { font-size: 2.2em; }
            
            .center-board { gap: 15px; margin-top: 70px;}
            .card { width: 85px; height: 125px; }
            .card-corner { top: 4px; left: 6px; }
            .card-corner-val { font-size: 20px; }
            .card-corner-suit { font-size: 14px; margin-top: 1px;}
            .card-suit { font-size: 45px; }
            #card3 { margin-top: -20px !important; }

            .bottom-panel { padding: 20px 15px; margin-top: 15px; border-radius: 20px;}
            #resultMsg { font-size: 1.3em; margin-bottom: 15px; }
            
            .controls { flex-direction: column; width: 100%; gap: 10px;}
            .action-input { width: 100%; font-size: 1.3em; padding: 12px; height: 55px; }
            #normalAction, #pairAction { width: 100%; display: flex; gap: 10px; flex-wrap: nowrap; }
            #actionArea button {
                min-width: 0; width: auto; flex: 1; height: 55px; padding: 0 10px; font-size: 1.05em;
            }
        }
    </style>
</head>
<body>

    <div class="top-action-bar" id="gameActionBar" style="display:none;">
        <button class="top-btn" id="hostResetBtn" onclick="forceReset()" style="display:none; color:#FF3366; border-color:#FF3366;">🛑 重置牌桌</button>
        <button class="top-btn" id="endGameBtn" onclick="endGame()" style="display:none; color:var(--gold); border-color:var(--gold);">🏆 結算排行榜</button>
    </div>

    <div class="overlay-screen" id="loginOverlay">
        <h1 class="title-gold">射龍門</h1>
        <div class="glass-panel" style="max-width: 450px; width: 90%;">
            <div class="input-group">
                <label>身份登記 (玩家暱稱)</label>
                <input type="text" id="playerName" placeholder="例如：高進" maxlength="10">
            </div>
            <button class="btn-primary" onclick="createRoom()" style="margin-top: 15px;">💎 開設尊爵包廂</button>
            
            <div class="divider-text">或者</div>
            
            <div class="input-group" style="margin-top: 15px;">
                <label>受邀入場 (4碼房號)</label>
                <input type="text" id="roomCodeInput" placeholder="輸入邀請碼" maxlength="4" style="text-transform: uppercase; letter-spacing: 10px;">
            </div>
            <button class="btn-secondary" onclick="joinRoom()" style="margin-top: 15px;">🚪 進入包廂</button>
        </div>
    </div>

    <div class="overlay-screen" id="waitingOverlay" style="display:none;">
        <div class="glass-panel" style="max-width: 600px; width: 95%; text-align: center;">
            <h2 style="color: #A0A0A0; font-weight: 700; letter-spacing: 3px; margin-top: 0;">包廂準備中</h2>
            <div style="font-size: 3.5em; font-family: 'Cinzel'; font-weight: 900; color: var(--gold); letter-spacing: 15px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 16px; border: 1px dashed var(--gold); margin: 20px 0;" id="waitingRoomCodeDisplay">----</div>
            <p style="color: #cbd5e1; margin-bottom: 5px;">請將房號分享給朋友加入</p>
            <div style="color: var(--gold); font-size:1.2em; font-weight: bold; margin-bottom: 20px;">已入座：<span id="waitingCount">0</span> / <span id="waitingMax">0</span></div>
            
            <div id="waitingPlayersGrid" style="display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; margin: 30px 0; width: 100%;">
                </div>

            <div id="hostWaitingAction" style="display:none; margin-top: 30px;">
                <button class="btn-primary" onclick="forceStart()">🚀 提前發牌 (強制開局)</button>
                <p style="color: #888; font-size: 0.9em; margin-top: 15px; font-weight:bold;">至少需 2 人即可開局，總底池將按實際人數計算。</p>
            </div>
            <div id="guestWaitingAction" style="display:none; margin-top: 30px; color: var(--gold); font-weight: 700; font-size:1.2em; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px;">
                ⏳ 等待室長確認開局...
            </div>
        </div>
    </div>

    <div class="overlay-screen" id="setupOverlay" style="display:none;">
        <div class="glass-panel" style="max-width: 420px; width: 92%;">
            <h2 style="color: var(--gold); text-align: center; margin-top:0; margin-bottom: 30px; font-size: 1.8em; font-weight:900;">規則設定</h2>
            <div class="input-group">
                <label>包廂座位數 (最大人數)：</label>
                <input type="number" id="maxPlayersInput" value="4" min="2" step="1">
            </div>
            <div class="input-group">
                <label>每人投注底池 ($)：</label>
                <input type="number" id="poolPerPlayerInput" value="500" min="50" step="50">
            </div>
            <div class="input-group">
                <label>PASS 過路費 ($ 0為免費)：</label>
                <input type="number" id="passFeeInput" value="50" min="0" step="10">
            </div>
            <div class="input-group">
                <label>使用幾副牌 (1~5副)：</label>
                <input type="number" id="decksInput" value="2" min="1" max="5" step="1">
            </div>
            <button class="btn-primary" style="margin-top: 25px;" onclick="setPool()">確認設定</button>
        </div>
    </div>

    <div id="shuffleOverlay">
        <div class="shuffle-icon">🃏</div>
        <h2 style="color:var(--gold); margin-top:30px; font-size: 2em; letter-spacing: 4px; font-weight:900; text-shadow: 0 0 20px var(--gold-glow);">牌庫見底<br>荷官重新洗牌中...</h2>
    </div>

    <div class="overlay-screen" id="resultOverlay" style="display:none;">
        <div class="glass-panel" style="max-width: 600px; width: 95%; max-height: 85vh; display:flex; flex-direction:column;">
            <h1 class="title-gold" style="font-size: 3em; margin-bottom: 10px;">🏆 終局結算</h1>
            <h3 style="color: #A0A0A0; text-align: center; margin-top: 0; margin-bottom: 25px; font-size:1.2em;">剩餘彩池：<span style="color:var(--gold);">均分 (每人在線玩家 +$<span id="finalPoolAmount">0</span>)</span></h3>
            <div class="player-list" id="leaderboardList" style="flex-grow: 1; overflow-y: auto; padding-right: 5px;"></div>
            <button class="btn-secondary" onclick="closeResult()" style="margin-top: 25px;">確認結算並準備新局</button>
        </div>
    </div>

    <div class="sidebar" id="mainSidebar" style="display:none;">
        <div class="room-tag">VIP 包廂<br><span id="displayRoomId">----</span></div>
        <div class="player-list" id="playerList"></div>
    </div>

    <div class="main-game" id="mainGameArea" style="display:none;">
        <div class="casino-table">
            <div class="table-info">
                <div class="info-box">
                    <div class="info-label">Total Pool</div>
                    <div class="info-val">$<span id="poolAmount">0</span></div>
                </div>
                <div class="info-box">
                    <div class="info-label">Cards</div>
                    <div class="info-val" style="color: #E2E8F0;"><span id="cardsLeft">0</span></div>
                </div>
            </div>

            <div class="center-board">
                <div class="card" id="card1"><div class="card-face card-back"></div><div class="card-face card-front" id="c1-front"></div></div>
                <div class="card" id="card3" style="margin-top:-40px; z-index: 5;"><div class="card-face card-back"></div><div class="card-face card-front" id="c3-front"></div></div>
                <div class="card" id="card2"><div class="card-face card-back"></div><div class="card-face card-front" id="c2-front"></div></div>
            </div>
        </div>

        <div class="bottom-panel">
            <div id="resultMsg">等待發牌...</div>
            
            <div class="controls" id="actionArea" style="display:none;">
                <input type="number" id="betAmount" class="action-input" placeholder="下注籌碼...">
                <div id="normalAction" style="display:flex; gap:15px; justify-content: center; flex-wrap: nowrap;">
                    <button class="btn-shoot" onclick="shoot('normal')">🚀 射門</button>
                    <button class="btn-pass" onclick="passRound()">💨 PASS</button>
                </div>
                <div id="pairAction" style="display:none; gap:15px; justify-content: center; flex-wrap: nowrap;">
                    <button class="btn-primary" style="background: linear-gradient(to bottom, #FF5252, #D32F2F); color:white; box-shadow: 0 8px 20px rgba(211,47,47,0.4);" onclick="shoot('high')">🔼 猜大</button>
                    <button class="btn-secondary" onclick="shoot('low')">🔽 猜小</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = "";
        let isMyTurn = false;
        let currentRoomId = "";
        let currentPassFee = 0; 
        let isImHost = false;

        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) { try { const AudioContext = window.AudioContext || window.webkitAudioContext; if(AudioContext) audioCtx = new AudioContext(); } catch(e) {} }
            return audioCtx;
        }
        function unlockAudio() {
            const ctx = getAudioContext();
            if(!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            try { const buffer = ctx.createBuffer(1, 1, 22050); const source = ctx.createBufferSource(); source.buffer = buffer; source.connect(ctx.destination); source.start(0); } catch(e){}
        }
        ['touchstart', 'touchend', 'click', 'keydown'].forEach(evt => { document.body.addEventListener(evt, unlockAudio, { capture: true }); });

        function playTone(freq, type, duration, vol=0.1) {
            const ctx = getAudioContext();
            if(!ctx || ctx.state !== 'running') return;
            try {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const sfx = {
            card: () => playTone(400, 'square', 0.1, 0.03),
            win: () => { playTone(440, 'sine', 0.1, 0.1); setTimeout(()=>playTone(554, 'sine', 0.1, 0.1), 100); setTimeout(()=>playTone(659, 'sine', 0.3, 0.1), 200); }, 
            lose: () => { playTone(300, 'sawtooth', 0.2, 0.1); setTimeout(()=>playTone(280, 'sawtooth', 0.2, 0.1), 200); setTimeout(()=>playTone(260, 'sawtooth', 0.4, 0.1), 400); }, 
            hit: () => { playTone(150, 'square', 0.3, 0.2); setTimeout(()=>playTone(100, 'square', 0.5, 0.2), 150); },
            coin: () => { playTone(1200, 'sine', 0.1, 0.1); setTimeout(()=>playTone(1600, 'sine', 0.3, 0.1), 100); },
            shuffle: () => { for(let i=0; i<15; i++) setTimeout(() => playTone(600 + Math.random()*400, 'triangle', 0.05, 0.03), i*60); }
        };

        function getPlayerName() { let name = document.getElementById('playerName').value.trim(); if (!name) alert("請輸入暱稱！"); return name; }
        
        function createRoom() {
            myName = getPlayerName();
            if (!myName) return;
            socket.emit('create_room', myName);
        }

        function joinRoom() {
            myName = getPlayerName();
            if (!myName) return;
            let roomId = document.getElementById('roomCodeInput').value.trim();
            if (roomId.length !== 4) return alert("請輸入 4 碼包廂號！");
            socket.emit('join_room', { playerName: myName, roomId: roomId });
        }

        socket.on('room_joined', (roomId) => {
            currentRoomId = roomId;
            document.getElementById('displayRoomId').innerText = roomId;
            document.getElementById('waitingRoomCodeDisplay').innerText = roomId;
            document.getElementById('loginOverlay').style.display = 'none';
            
            document.getElementById('mainSidebar').style.display = 'flex';
            document.getElementById('mainGameArea').style.display = 'flex';
            document.getElementById('gameActionBar').style.display = 'flex';
        });

        socket.on('error_msg', (msg) => { alert(msg); });

        function setPool() {
            let poolPerPlayer = parseInt(document.getElementById('poolPerPlayerInput').value);
            let passFee = parseInt(document.getElementById('passFeeInput').value);
            let maxPlayers = parseInt(document.getElementById('maxPlayersInput').value);
            let decks = parseInt(document.getElementById('decksInput').value);
            if(isNaN(poolPerPlayer) || poolPerPlayer <= 0) return alert("底池金額無效！");
            if(isNaN(maxPlayers) || maxPlayers < 2) return alert("遊戲至少需要 2 人！");
            if(isNaN(passFee) || passFee < 0) passFee = 0;
            if(isNaN(decks) || decks < 1 || decks > 5) return alert("牌數請設定在 1 到 5 副之間！");
            socket.emit('set_pool', { poolPerPlayer, passFee, maxPlayers, decks });
        }

        function forceStart() { socket.emit('force_start'); }
        function forceReset() { if(confirm("確定要強制中斷目前牌局，並讓所有人重新設定嗎？")) socket.emit('force_reset'); }
        function endGame() { if(confirm("確定要終止牌局，並結算剩餘彩池嗎？(結算後大家盈虧將歸零並重開新局)")) socket.emit('end_game'); }
        function closeResult() { document.getElementById('resultOverlay').style.display = 'none'; }

        function renderCard(cardObj, elementId) {
            if (!cardObj) return;
            const colorClass = (cardObj.suit === '♥' || cardObj.suit === '♦') ? 'red-suit' : '';
            const faces = {1:'A', 11:'J', 12:'Q', 13:'K'};
            const displayVal = faces[cardObj.value] || cardObj.value;
            document.getElementById(elementId).innerHTML = `
                <div class="card-corner ${colorClass}">
                    <div class="card-corner-val">${displayVal}</div>
                    <div class="card-corner-suit">${cardObj.suit}</div>
                </div>
                <div class="card-suit ${colorClass}">${cardObj.suit}</div>
            `;
        }

        function updatePlayerList(state) {
            let listHtml = '';
            state.playerOrder.forEach((id, index) => {
                let p = state.players[id];
                let isCurrentTurn = (index === state.currentTurnIndex && state.status === 'playing');
                let rowClass = isCurrentTurn ? 'player-item active-turn' : 'player-item';
                let turnMarker = isCurrentTurn ? '👉 ' : '';
                let hostMarker = p.isHost ? '👑 ' : '';
                let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                let pnlSign = p.pnl > 0 ? '+' : '';
                listHtml += `<div class="${rowClass}"><span>${turnMarker}${hostMarker}${p.name} ${id === socket.id ? '<span style="color:var(--gold); font-size:0.8em;">(你)</span>' : ''}</span><span class="${pnlClass}">${pnlSign}${p.pnl}</span></div>`;
            });

            for(let id in state.players) {
                if(state.players[id].isWaiting) {
                    let p = state.players[id];
                    let hostMarker = p.isHost ? '👑 ' : '';
                    let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                    let pnlSign = p.pnl > 0 ? '+' : '';
                    listHtml += `<div class="player-item" style="opacity: 0.5;"><span>⏳ ${hostMarker}${p.name} ${id === socket.id ? '<span style="color:var(--gold); font-size:0.8em;">(你)</span>' : ''} <span style="font-size:0.8em; color:#A0A0A0;">(等入局)</span></span><span class="${pnlClass}">${pnlSign}${p.pnl}</span></div>`;
                }
            }

            if(state.offlinePlayers && state.offlinePlayers.length > 0) {
                listHtml += `<div style="text-align:center; color:#666; margin: 25px 0 10px 0; font-size:0.85em; font-weight:900; letter-spacing: 3px;">💤 離線暫存區</div>`;
                state.offlinePlayers.forEach(p => {
                    let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                    let pnlSign = p.pnl > 0 ? '+' : '';
                    listHtml += `<div class="player-item" style="color: #666; font-style: italic;"><span>🔌 ${p.name}</span><span class="${pnlClass}">${pnlSign}${p.pnl}</span></div>`;
                });
            }

            document.getElementById('playerList').innerHTML = listHtml;
            isMyTurn = (state.playerOrder[state.currentTurnIndex] === socket.id);
        }

        function renderWaitingRoom(state) {
            let currentCount = Object.keys(state.players).length;
            document.getElementById('waitingCount').innerText = currentCount;
            document.getElementById('waitingMax').innerText = state.maxPlayers;
            
            let gridHtml = '';
            let playerList = Object.values(state.players);
            
            for(let i=0; i<playerList.length; i++) {
                let p = playerList[i];
                let hostIcon = p.isHost ? '👑' : '👤';
                let meTag = p.name === myName ? '<br><span style="font-size:0.8em; color:var(--gold);">(你)</span>' : '';
                gridHtml += `<div style="background: rgba(212,175,55,0.1); border: 1px solid var(--gold); border-radius: 16px; padding: 20px 10px; text-align: center; color: white; box-shadow: inset 0 0 20px rgba(212,175,55,0.1); font-weight:bold; font-size:1.1em;">
                    <div style="font-size: 2.5em; margin-bottom:10px;">${hostIcon}</div><div>${p.name}${meTag}</div>
                </div>`;
            }
            
            let emptySlots = state.maxPlayers - currentCount;
            for(let i=0; i<emptySlots; i++) {
                gridHtml += `<div style="background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 16px; padding: 20px 10px; text-align: center; color: #666; font-weight:bold; font-size:1.1em;">
                    <div style="font-size: 2.5em; margin-bottom:10px; opacity:0.3;">🪑</div><div>等待入座...</div>
                </div>`;
            }
            document.getElementById('waitingPlayersGrid').innerHTML = gridHtml;
        }

        socket.on('update_state', (state) => {
            currentPassFee = state.passFee; 
            document.getElementById('poolAmount').innerText = state.pool;
            document.getElementById('cardsLeft').innerText = state.deck.length;
            updatePlayerList(state);

            let passButtons = document.querySelectorAll('.btn-pass');
            passButtons.forEach(btn => { btn.innerText = state.passFee > 0 ? `💨 PASS (-$${state.passFee})` : `💨 PASS`; });

            isImHost = (state.players[socket.id] && state.players[socket.id].isHost);
            document.getElementById('hostResetBtn').style.display = isImHost ? 'block' : 'none';
            document.getElementById('endGameBtn').style.display = (isImHost && state.status === 'playing') ? 'block' : 'none';

            let setupOverlay = document.getElementById('setupOverlay');
            let waitingOverlay = document.getElementById('waitingOverlay');
            
            if (state.status === 'waiting_for_host') {
                setupOverlay.style.display = 'flex';
                waitingOverlay.style.display = 'none';
                document.getElementById('actionArea').style.display = 'none'; 
                ['card1', 'card2', 'card3'].forEach(id => document.getElementById(id).classList.remove('flipped'));

                if (isImHost) {
                    document.getElementById('setupTitle').innerText = state.pool === 0 ? "設定新局" : "室長規則設定";
                    document.getElementById('setupControls').style.display = 'block';
                } else {
                    document.getElementById('setupTitle').innerText = "等待室長設定規則⏳...";
                    document.getElementById('setupControls').style.display = 'none';
                }
            } else if (state.status === 'waiting_for_players') {
                setupOverlay.style.display = 'none';
                waitingOverlay.style.display = 'flex';
                document.getElementById('actionArea').style.display = 'none'; 
                
                renderWaitingRoom(state);

                if(isImHost) {
                    document.getElementById('hostWaitingAction').style.display = 'block';
                    document.getElementById('guestWaitingAction').style.display = 'none';
                } else {
                    document.getElementById('hostWaitingAction').style.display = 'none';
                    document.getElementById('guestWaitingAction').style.display = 'block';
                }
            } else {
                setupOverlay.style.display = 'none';
                waitingOverlay.style.display = 'none';
            }

            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = state.message;
            msgEl.style.color = state.messageColor;
        });

        socket.on('shuffling_deck', () => {
            document.getElementById('shuffleOverlay').style.display = 'flex';
            sfx.shuffle();
            setTimeout(() => { document.getElementById('shuffleOverlay').style.display = 'none'; }, 3000);
        });

        socket.on('auto_replenish', (state) => {
            updatePlayerList(state);
            document.getElementById('poolAmount').innerText = state.pool;
            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = state.message;
            msgEl.style.color = state.messageColor;
            sfx.coin(); 
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.1 }, colors: ['#D4AF37', '#FFDF73', '#FFFFFF'], zIndex: 9999 });
        });

        socket.on('cards_dealt', (state) => {
            updatePlayerList(state); 
            document.getElementById('poolAmount').innerText = state.pool;
            document.getElementById('cardsLeft').innerText = state.deck.length;

            ['card1', 'card2', 'card3'].forEach(id => document.getElementById(id).classList.remove('flipped'));
            
            setTimeout(() => {
                renderCard(state.tableCards.c1, 'c1-front');
                renderCard(state.tableCards.c2, 'c2-front');
                document.getElementById('c3-front').innerHTML = ''; 

                document.getElementById('card1').classList.add('flipped');
                sfx.card(); 

                setTimeout(() => {
                    document.getElementById('card2').classList.add('flipped');
                    sfx.card(); 
                }, 300);
            }, 300);

            setTimeout(() => {
                let msgEl = document.getElementById('resultMsg');
                msgEl.innerText = state.message;
                msgEl.style.color = state.messageColor;

                if (isMyTurn) {
                    let minBet = Math.min(state.pool, currentPassFee > 0 ? currentPassFee : 10);
                    let betInput = document.getElementById('betAmount');
                    betInput.value = ''; betInput.min = minBet; betInput.placeholder = `最低 $${minBet}...`;

                    document.getElementById('actionArea').style.display = 'flex';
                    document.getElementById('normalAction').style.display = state.isPair ? 'none' : 'flex';
                    document.getElementById('pairAction').style.display = state.isPair ? 'flex' : 'none';
                }
            }, 1000);
        });

        socket.on('shoot_result', (data) => {
            document.getElementById('actionArea').style.display = 'none'; 
            updatePlayerList(data.state);
            document.getElementById('poolAmount').innerText = data.state.pool;

            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = data.state.message;
            msgEl.style.color = data.state.messageColor;

            renderCard(data.state.tableCards.c3, 'c3-front');
            document.getElementById('card3').classList.add('flipped');
            sfx.card(); 

            setTimeout(() => {
                if (data.state.message.includes('撞柱')) { sfx.hit(); } 
                else if (data.resultType === 'win') { sfx.win(); confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 }, colors: ['#00E676', '#D4AF37', '#ffffff']}); } 
                else { sfx.lose(); }
            }, 400); 
        });

        socket.on('game_ended', (data) => {
            document.getElementById('resultOverlay').style.display = 'flex';
            document.getElementById('finalPoolAmount').innerText = data.distributedShare;
            
            let listHtml = '';
            data.leaderboard.forEach((p, index) => {
                let medal = '';
                if (index === 0) medal = '🥇'; else if (index === 1) medal = '🥈'; else if (index === 2) medal = '🥉'; else medal = `<span style="font-size:0.7em; color:#666;">${index + 1}</span>`;
                
                let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                let pnlSign = p.pnl > 0 ? '+' : '';
                let isOffline = p.name.includes('(已離線)');
                let nameStyle = isOffline ? 'color: #666; font-style: italic;' : 'color: white;';
                
                listHtml += `
                <div class="player-item" style="${nameStyle} border-bottom: 1px solid rgba(255,255,255,0.05); padding: 18px 15px;">
                    <span style="display:flex; align-items:center;"><span style="width:40px; text-align:left;">${medal}</span>${p.name}</span>
                    <span class="${pnlClass}" style="font-weight:900; font-size:1.2em;">${pnlSign}${p.pnl}</span>
                </div>`;
            });
            document.getElementById('leaderboardList').innerHTML = listHtml;
            sfx.win(); 
            confetti({ particleCount: 400, spread: 150, origin: { y: 0.3 }, zIndex: 4000 });
        });

        function shoot(guessType) {
            let bet = parseInt(document.getElementById('betAmount').value);
            let currentPool = parseInt(document.getElementById('poolAmount').innerText);
            let minBet = Math.min(currentPool, currentPassFee > 0 ? currentPassFee : 10);
            
            if(isNaN(bet) || bet < minBet) return alert(`⚠️ 下注不能低於最低限制 ($${minBet})！`);
            if(bet > currentPool) return alert(`⚠️ 籌碼不能超過目前總彩池 ($${currentPool})！`);
            socket.emit('shoot', { bet, guessType });
        }
        
        function passRound() { socket.emit('pass'); }
    </script>
</body>
</html>
