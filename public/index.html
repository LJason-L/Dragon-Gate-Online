<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>多人連線版 射龍門 🐉</title>
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { --table-color: radial-gradient(circle at 50% 40%, #1a5e20 0%, #003300 100%); --gold: #FFD700; --panel-bg: rgba(0, 0, 0, 0.7); }
        body { font-family: 'Segoe UI', sans-serif; margin: 0; background: #111; display: flex; height: 100vh; color: white; position: relative;}
        
        #loginOverlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: radial-gradient(circle at center, #1a1a1a 0%, #000 100%); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow-y: auto; padding: 20px 0; box-sizing: border-box;}
        #loginOverlay h1 { font-size: 4.5em; color: var(--gold); text-shadow: 0 0 30px rgba(255,215,0,0.6); margin-bottom: 30px; letter-spacing: 5px;}
        .login-box { background: rgba(30, 30, 30, 0.8); padding: 40px; border-radius: 20px; border: 1px solid #444; box-shadow: 0 20px 50px rgba(0,0,0,0.9); width: 90%; max-width: 400px; backdrop-filter: blur(10px); margin: auto;}
        
        .input-group { margin-bottom: 25px; text-align: left; }
        .input-group label { display: block; color: #aaa; margin-bottom: 10px; font-size: 0.95em; font-weight: bold; }
        .login-box input { width: 100%; box-sizing: border-box; padding: 15px; font-size: 1.3em; border-radius: 10px; border: 2px solid #333; background: #0a0a0a; color: white; outline: none; transition: 0.3s; text-align: center; }
        .login-box input::placeholder { color: #555; }
        .login-box input:focus { border-color: var(--gold); box-shadow: 0 0 15px rgba(255, 215, 0, 0.2); background: #111;}
        
        .login-box button { width: 100%; padding: 15px; font-size: 1.3em; border-radius: 10px; font-weight: bold; border: none; cursor: pointer; transition: 0.2s; }
        .btn-primary { background: linear-gradient(135deg, #FFD700, #F39C12); color: #000; box-shadow: 0 4px 15px rgba(243, 156, 18, 0.4); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(243, 156, 18, 0.6); filter: brightness(1.1); }
        
        .divider-text { color: #777; font-size: 0.9em; margin: 25px 0; position: relative; display: flex; align-items: center; justify-content: center; font-weight: bold;}
        .divider-text::before, .divider-text::after { content: ""; flex: 1; height: 1px; background: #444; margin: 0 15px; }
        
        .join-group { background: rgba(0,0,0,0.4); padding: 25px; border-radius: 15px; border: 1px solid #333; }
        .btn-secondary { background: linear-gradient(135deg, #2980b9, #34495e); color: white; box-shadow: 0 4px 15px rgba(41, 128, 185, 0.4); }
        .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 8px 25px rgba(41, 128, 185, 0.6); filter: brightness(1.2); }
        #roomCodeInput { letter-spacing: 10px; font-weight: bold; color: var(--gold); text-transform: uppercase; }

        #setupOverlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow-y: auto; }
        .setup-group { margin: 15px 0; width: 100%; max-width: 300px; text-align: left; margin-left: auto; margin-right: auto;}
        .setup-group label { color: #ccc; font-size: 1.1em; display: block; margin-bottom: 5px;}
        #setupControls input { font-size: 1.5em; padding: 10px; border-radius: 8px; border: 2px solid var(--gold); background: #111; color: var(--gold); text-align: center; width: 100%; box-sizing: border-box; outline: none;}
        #setupControls button { font-size: 1.2em; padding: 12px 30px; cursor: pointer; border-radius: 8px; font-weight: bold; border: none; background: linear-gradient(135deg, #FFD700, #F39C12); color: black; margin-top: 15px; width: 100%; max-width: 300px;}
        
        .host-reset-btn { position: absolute; top: 15px; left: 15px; background: linear-gradient(135deg, #c0392b, #e74c3c); color: white; border: 2px solid #fff; padding: 10px 15px; font-size: 1em; border-radius: 8px; cursor: pointer; z-index: 2000; display: none; }
        .end-game-btn { position: absolute; top: 15px; right: 15px; background: linear-gradient(135deg, #8e44ad, #9b59b6); color: white; border: 2px solid #fff; padding: 10px 15px; font-size: 1em; border-radius: 8px; cursor: pointer; z-index: 2000; box-shadow: 0 4px 10px rgba(0,0,0,0.5); display: none; }

        .sidebar { width: 300px; background: #111; border-right: 2px solid #333; padding: 20px; box-sizing: border-box; display: flex; flex-direction: column; margin-top: 50px; }
        .room-tag { background: rgba(255,215,0,0.1); border: 1px solid var(--gold); color: var(--gold); padding: 8px 10px; border-radius: 8px; font-size: 1.3em; text-align: center; margin-bottom: 20px; font-weight: bold; letter-spacing: 2px;}
        .sidebar h2 { color: white; text-align: center; border-bottom: 1px solid #555; padding-bottom: 10px; margin-top: 0; font-size: 1.2em;}
        .player-list { flex-grow: 1; overflow-y: auto; }
        .player-item { display: flex; align-items: center; justify-content: space-between; padding: 15px 10px; border-bottom: 1px solid #333; font-size: 1.2em; transition: 0.3s; }
        .active-turn { background: rgba(255, 215, 0, 0.2); border-left: 5px solid var(--gold); }
        .pnl-positive { color: #00E676; font-weight: bold; }
        .pnl-negative { color: #FF1744; font-weight: bold; }

        .main-game { flex-grow: 1; padding: 20px; display: flex; justify-content: center; align-items: center; }
        .casino-table { width: 100%; max-width: 1200px; height: 90%; background: var(--table-color); border-radius: 100px; box-shadow: inset 0 0 50px rgba(0,0,0,0.8), 0 0 0 15px #3e2723; display: flex; flex-direction: column; justify-content: space-between; padding: 40px; box-sizing: border-box; }
        
        .top-panel { display: flex; justify-content: space-between; gap: 10px; }
        .pool-box, .deck-info { background: var(--panel-bg); border: 2px solid var(--gold); border-radius: 15px; padding: 15px; text-align: center; flex: 1;}
        .pool-amount { font-size: 3em; color: var(--gold); font-weight: bold; }
        
        .center-board { display: flex; justify-content: center; gap: 40px; perspective: 1200px; }
        .card { width: 120px; height: 180px; position: relative; transform-style: preserve-3d; transition: transform 0.6s; border-radius: 10px; box-shadow: 0 10px 20px rgba(0,0,0,0.5); }
        .card.flipped { transform: rotateY(180deg); }
        .card-face { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 10px; background: white; border: 1px solid #ccc; color: black; box-sizing: border-box;}
        .card-back { background: repeating-linear-gradient(45deg, #0d47a1, #0d47a1 10px, #1565c0 10px, #1565c0 20px); transform: rotateY(0deg); border: 4px solid white;}
        .card-front { transform: rotateY(180deg); position: relative; }
        
        .red-suit { color: #d32f2f; }
        .card-corner { position: absolute; top: 6px; left: 8px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .card-corner-val { font-size: 26px; font-weight: bold; }
        .card-corner-suit { font-size: 18px; margin-top: 2px; }
        .card-suit { font-size: 60px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); display: flex; align-items: center; justify-content: center; }

        .bottom-panel { background: var(--panel-bg); border-radius: 15px; padding: 20px; text-align: center; min-height: 120px; display: flex; flex-direction: column; justify-content: center;}
        #resultMsg { font-size: 1.8em; font-weight: bold; margin-bottom: 15px; }
        .controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
        .btn-shoot { background: #00C853; color: white; border:none; padding: 15px 30px; border-radius:8px; font-size:1.2em; font-weight:bold; cursor:pointer;}
        .btn-pass { background: #546E7A; color: white; border:none; padding: 15px 30px; border-radius:8px; font-size:1.2em; font-weight:bold; cursor:pointer;}
        .btn-danger { background: #D50000; color: white; border:none; padding: 15px 30px; border-radius:8px; font-size:1.2em; font-weight:bold; cursor:pointer;}

        #resultOverlay { position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 3000; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; overflow-y: auto; padding: 20px 0;}
        .leaderboard-container { width: 90%; max-width: 600px; background: #222; border-radius: 15px; padding: 20px; border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(255,215,0,0.3); max-height: none; margin: auto; }
        .leaderboard-item { display: flex; justify-content: space-between; padding: 15px 20px; border-bottom: 1px solid #444; font-size: 1.8em; align-items: center; }
        .medal-icon { font-size: 1.2em; margin-right: 15px; }

        #shuffleOverlay { position: absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(0,0,0,0.9); z-index:2500; display:none; flex-direction:column; justify-content:center; align-items:center; }
        .shuffle-icon { font-size: 6em; animation: spin 1s infinite linear; }
        @keyframes spin { 100% { transform: rotateY(360deg); } }

        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            #loginOverlay h1 { font-size: 3em; margin-bottom: 15px; }
            .login-box { padding: 20px; width: 95%; box-sizing: border-box; }
            .login-box input, .login-box button { font-size: 1.1em; padding: 12px; }
            .join-group { padding: 15px; }
            
            .host-reset-btn { top: 5px; left: 5px; font-size: 0.8em; padding: 5px 10px; }
            .end-game-btn { top: 5px; right: 5px; font-size: 0.8em; padding: 5px 10px; }

            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 2px solid #333; margin-top: 40px; padding: 10px; box-sizing: border-box;}
            .room-tag { font-size: 1em; margin-bottom: 10px; padding: 5px; }
            .player-list { max-height: 250px; overflow-y: auto; }
            .player-item { font-size: 1em; padding: 8px; }
            
            .main-game { padding: 10px; height: auto; min-height: 60vh; }
            .casino-table { border-radius: 20px; padding: 15px; height: 100%; justify-content: flex-start; gap: 20px;}
            
            .pool-amount { font-size: 1.8em; }
            .top-panel { margin-bottom: 10px; }
            
            .center-board { gap: 10px; }
            .card { width: 70px; height: 105px; border-radius: 6px; }
            
            .card-corner { top: 3px; left: 4px; }
            .card-corner-val { font-size: 16px; }
            .card-corner-suit { font-size: 12px; margin-top: 1px;}
            .card-suit { font-size: 35px; }
            
            #card3 { margin-top: -15px !important; }

            #resultMsg { font-size: 1.2em; }
            .controls { flex-wrap: wrap; gap: 10px; }
            #betAmount { width: 100%; max-width: 200px; font-size: 1.2em; padding: 10px; margin-bottom: 5px;}
            .btn-shoot, .btn-pass, .btn-danger { padding: 10px 15px; font-size: 1em; flex: 1; min-width: 80px;}
            
            #resultOverlay h1 { font-size: 2.5em; }
            #resultOverlay h2 { font-size: 1.2em; }
            .leaderboard-item { font-size: 1.2em; padding: 10px; }
        }
    </style>
</head>
<body>

    <button id="hostResetBtn" class="host-reset-btn" onclick="forceReset()">🛑 強制重置</button>
    <button id="endGameBtn" class="end-game-btn" onclick="endGame()">🏆 結束並結算</button>

    <div id="loginOverlay">
        <h1>🐉 射龍門 大廳 🐉</h1>
        <div class="login-box">
            <div class="input-group">
                <label>📍 第一步：輸入遊戲暱稱</label>
                <input type="text" id="playerName" placeholder="例如：賭神高進" maxlength="10">
            </div>
            <button class="btn-primary" onclick="createRoom()">👑 創建專屬新包廂</button>
            <div class="divider-text">或者</div>
            <div class="join-group">
                <div class="input-group" style="margin-bottom: 15px;">
                    <label>📍 第二步：加入朋友牌局</label>
                    <input type="text" id="roomCodeInput" placeholder="輸入 4 碼房號" maxlength="4">
                </div>
                <button class="btn-secondary" onclick="joinRoom()">🚪 加入包廂</button>
            </div>
        </div>
    </div>

    <div id="shuffleOverlay">
        <div class="shuffle-icon">🃏</div>
        <h1 style="color:var(--gold); margin-top:20px; font-size: 2em; text-align:center;">牌靴見底<br>莊家重新洗牌中...</h1>
    </div>

    <div id="setupOverlay" style="display:none;">
        <h1 id="setupTitle" style="font-size: 2em; margin-top: 20px;">設定包廂規則</h1>
        <div id="setupControls">
            <div class="setup-group">
                <label>包廂人數上限：</label>
                <input type="number" id="maxPlayersInput" value="4" min="2" step="1">
            </div>
            <div class="setup-group">
                <label>每人投注底池 (入局/補血時扣除)：</label>
                <input type="number" id="poolPerPlayerInput" value="500" min="50" step="50">
            </div>
            <div class="setup-group">
                <label>PASS 過路費 (0為免費)：</label>
                <input type="number" id="passFeeInput" value="50" min="0" step="10">
            </div>
            <div class="setup-group">
                <label>使用幾副牌 (1~5副)：</label>
                <input type="number" id="decksInput" value="2" min="1" max="5" step="1">
            </div>
            <button onclick="setPool()">確認設定並等待玩家</button>
        </div>
    </div>

    <div id="resultOverlay" style="display:none;">
        <h1 style="font-size: 3.5em; margin-bottom: 10px;">🏆 最終結算 🏆</h1>
        <h2 style="color: #aaa; margin-bottom: 30px;">剩餘彩池: <span id="finalPoolAmount" style="color:var(--gold);">已結算</span></h2>
        <div class="leaderboard-container" id="leaderboardList"></div>
        <button onclick="closeResult()" style="margin-top: 30px; font-size: 1.2em; padding: 12px 30px; border-radius: 8px; cursor: pointer; background: #555; color: white; border: none;">關閉結算面板</button>
    </div>

    <div class="sidebar">
        <div class="room-tag">包廂號碼：<span id="displayRoomId">----</span></div>
        <h2>玩家順序與盈虧</h2>
        <div class="player-list" id="playerList"></div>
    </div>

    <div class="main-game">
        <div class="casino-table">
            <div class="top-panel">
                <div class="pool-box">
                    <div style="color:#aaa; font-size: 0.8em;">Total Pool</div>
                    <div class="pool-amount">$<span id="poolAmount">0</span></div>
                </div>
                <div class="deck-info">
                    <div style="color:#aaa; font-size: 0.8em;">牌靴剩餘</div>
                    <div class="pool-amount"><span id="cardsLeft">104</span></div>
                </div>
            </div>

            <div class="center-board">
                <div class="card" id="card1"><div class="card-face card-back"></div><div class="card-face card-front" id="c1-front"></div></div>
                <div class="card" id="card3" style="margin-top:-30px;"><div class="card-face card-back"></div><div class="card-face card-front" id="c3-front"></div></div>
                <div class="card" id="card2"><div class="card-face card-back"></div><div class="card-face card-front" id="c2-front"></div></div>
            </div>

            <div class="bottom-panel">
                <div id="resultMsg">等待開局...</div>
                
                <div class="controls" id="actionArea" style="display:none;">
                    <input type="number" id="betAmount" placeholder="下注籌碼..." min="10" step="10" style="width:150px; font-size:1.3em; text-align:center; border-radius:8px; outline:none; border:2px solid var(--gold); background:#222; color:var(--gold);">
                    <div id="normalAction" style="display:flex; gap:10px; width: 100%; justify-content: center;">
                        <button class="btn-shoot" onclick="shoot('normal')">🚀 射門</button>
                        <button class="btn-pass" onclick="passRound()">💨 PASS</button>
                    </div>
                    <div id="pairAction" style="display:none; gap:10px; width: 100%; justify-content: center;">
                        <button class="btn-danger" onclick="shoot('high')">🔼 猜大</button>
                        <button class="btn-danger" onclick="shoot('low')">🔽 猜小</button>
                        <button class="btn-pass" onclick="passRound()">💨 PASS</button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = "";
        let isMyTurn = false;
        let currentRoomId = "";
        let currentPassFee = 0; 

        // ==========================================
        // 🎵 地毯式強制音效解鎖引擎
        // ==========================================
        let audioCtx = null;
        
        function getAudioContext() {
            if (!audioCtx) {
                try {
                    const AudioContext = window.AudioContext || window.webkitAudioContext;
                    if(AudioContext) audioCtx = new AudioContext();
                } catch(e) {}
            }
            return audioCtx;
        }

        function unlockAudio() {
            const ctx = getAudioContext();
            if(!ctx) return;
            if (ctx.state === 'suspended') {
                ctx.resume();
            }
            try {
                const buffer = ctx.createBuffer(1, 1, 22050);
                const source = ctx.createBufferSource();
                source.buffer = buffer;
                source.connect(ctx.destination);
                source.start(0);
            } catch(e){}
        }

        ['touchstart', 'touchend', 'click', 'keydown'].forEach(evt => {
            document.body.addEventListener(evt, unlockAudio, { capture: true });
        });

        function playTone(freq, type, duration, vol=0.1) {
            const ctx = getAudioContext();
            if(!ctx || ctx.state !== 'running') return;
            try {
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain);
                gain.connect(ctx.destination);
                osc.start();
                osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const sfx = {
            card: () => playTone(400, 'square', 0.1, 0.03),
            win: () => { 
                playTone(440, 'sine', 0.1, 0.1); 
                setTimeout(()=>playTone(554, 'sine', 0.1, 0.1), 100); 
                setTimeout(()=>playTone(659, 'sine', 0.3, 0.1), 200); 
            }, 
            lose: () => { 
                playTone(300, 'sawtooth', 0.2, 0.1); 
                setTimeout(()=>playTone(280, 'sawtooth', 0.2, 0.1), 200); 
                setTimeout(()=>playTone(260, 'sawtooth', 0.4, 0.1), 400); 
            }, 
            hit: () => { 
                playTone(150, 'square', 0.3, 0.2); 
                setTimeout(()=>playTone(100, 'square', 0.5, 0.2), 150); 
            },
            coin: () => {
                playTone(1200, 'sine', 0.1, 0.1);
                setTimeout(()=>playTone(1600, 'sine', 0.3, 0.1), 100);
            },
            shuffle: () => {
                for(let i=0; i<15; i++) {
                    setTimeout(() => playTone(600 + Math.random()*400, 'triangle', 0.05, 0.03), i*60);
                }
            }
        };
        // ==========================================

        function getPlayerName() {
            let name = document.getElementById('playerName').value.trim();
            if (!name) alert("請輸入暱稱！");
            return name;
        }

        function createRoom() {
            myName = getPlayerName();
            if (!myName) return;
            socket.emit('create_room', myName);
        }

        function joinRoom() {
            myName = getPlayerName();
            if (!myName) return;
            let roomId = document.getElementById('roomCodeInput').value.trim();
            if (roomId.length !== 4) return alert("請輸入 4 碼包廂號！");
            socket.emit('join_room', { playerName: myName, roomId: roomId });
        }

        socket.on('room_joined', (roomId) => {
            currentRoomId = roomId;
            document.getElementById('displayRoomId').innerText = roomId;
            document.getElementById('loginOverlay').style.display = 'none';
        });

        socket.on('error_msg', (msg) => { alert(msg); });

        function setPool() {
            // 🚀 改為讀取「每人投注金額」
            let poolPerPlayer = parseInt(document.getElementById('poolPerPlayerInput').value);
            let passFee = parseInt(document.getElementById('passFeeInput').value);
            let maxPlayers = parseInt(document.getElementById('maxPlayersInput').value);
            let decks = parseInt(document.getElementById('decksInput').value);
            
            if(isNaN(poolPerPlayer) || poolPerPlayer <= 0) return alert("底池金額無效！");
            if(isNaN(maxPlayers) || maxPlayers < 2) return alert("遊戲至少需要 2 人！");
            if(isNaN(passFee) || passFee < 0) passFee = 0;
            if(isNaN(decks) || decks < 1 || decks > 5) return alert("牌數請設定在 1 到 5 副之間！");
            
            socket.emit('set_pool', { poolPerPlayer, passFee, maxPlayers, decks });
        }

        function forceReset() {
            if(confirm("確定要強制中斷目前牌局，並讓所有人重新設定嗎？")) {
                socket.emit('force_reset');
            }
        }

        function endGame() {
            if(confirm("確定要終止牌局，並將剩餘彩池均分給【在線玩家】進行結算嗎？(斷線玩家的虧損仍會列入排行榜紀錄)")) {
                socket.emit('end_game');
            }
        }
        
        function closeResult() {
            document.getElementById('resultOverlay').style.display = 'none';
        }

        function renderCard(cardObj, elementId) {
            if (!cardObj) return;
            const colorClass = (cardObj.suit === '♥' || cardObj.suit === '♦') ? 'red-suit' : '';
            const faces = {1:'A', 11:'J', 12:'Q', 13:'K'};
            const displayVal = faces[cardObj.value] || cardObj.value;
            document.getElementById(elementId).innerHTML = `
                <div class="card-corner ${colorClass}">
                    <div class="card-corner-val">${displayVal}</div>
                    <div class="card-corner-suit">${cardObj.suit}</div>
                </div>
                <div class="card-suit ${colorClass}">${cardObj.suit}</div>
            `;
        }

        // 🚀 UI 大翻新：渲染活躍、觀戰與離線玩家 🚀
        function updatePlayerList(state) {
            let listHtml = '';
            
            // 1. 正常在牌桌上廝殺的活躍玩家
            state.playerOrder.forEach((id, index) => {
                let p = state.players[id];
                let isCurrentTurn = (index === state.currentTurnIndex && state.status === 'playing');
                let rowClass = isCurrentTurn ? 'player-item active-turn' : 'player-item';
                let turnMarker = isCurrentTurn ? '👉 ' : '';
                let hostMarker = p.isHost ? '👑 ' : '';
                let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                let pnlSign = p.pnl > 0 ? '+' : '';
                
                listHtml += `<div class="${rowClass}">
                    <span>${turnMarker}${hostMarker}${p.name} ${id === socket.id ? '(你)' : ''}</span> 
                    <span class="${pnlClass}">${pnlSign}${p.pnl}</span>
                </div>`;
            });

            // 2. 中途加入、正在等彩池破產補血的玩家
            for(let id in state.players) {
                if(state.players[id].isWaiting) {
                    let p = state.players[id];
                    let hostMarker = p.isHost ? '👑 ' : '';
                    let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                    let pnlSign = p.pnl > 0 ? '+' : '';
                    
                    listHtml += `<div class="player-item" style="opacity: 0.6; font-size: 0.9em;">
                        <span>⏳ ${hostMarker}${p.name} ${id === socket.id ? '(你)' : ''} <span style="color:#aaa;">(觀戰/等補血)</span></span> 
                        <span class="${pnlClass}">${pnlSign}${p.pnl}</span>
                    </div>`;
                }
            }

            // 3. 落跑的離線玩家
            if(state.offlinePlayers && state.offlinePlayers.length > 0) {
                listHtml += `<div style="text-align:center; color:#777; margin: 15px 0 5px 0; font-size:0.9em; letter-spacing: 2px;">--- 💤 離線暫存區 💤 ---</div>`;
                state.offlinePlayers.forEach(p => {
                    let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                    let pnlSign = p.pnl > 0 ? '+' : '';
                    
                    listHtml += `<div class="player-item" style="color: #666; font-style: italic; font-size: 0.9em;">
                        <span>🔌 ${p.name}</span> 
                        <span class="${pnlClass}">${pnlSign}${p.pnl}</span>
                    </div>`;
                });
            }

            document.getElementById('playerList').innerHTML = listHtml;
            
            // 只有活躍玩家才能看到操作按鈕
            isMyTurn = (state.playerOrder[state.currentTurnIndex] === socket.id);
        }

        socket.on('update_state', (state) => {
            currentPassFee = state.passFee; 
            document.getElementById('poolAmount').innerText = state.pool;
            document.getElementById('cardsLeft').innerText = state.deck.length;
            updatePlayerList(state);

            let passButtons = document.querySelectorAll('.btn-pass');
            passButtons.forEach(btn => {
                btn.innerText = state.passFee > 0 ? `💨 PASS (-$${state.passFee})` : `💨 PASS`;
            });

            let isHost = (state.players[socket.id] && state.players[socket.id].isHost);
            document.getElementById('hostResetBtn').style.display = isHost ? 'block' : 'none';
            document.getElementById('endGameBtn').style.display = (isHost && state.status === 'playing') ? 'block' : 'none';

            let setupOverlay = document.getElementById('setupOverlay');
            
            if (state.status === 'waiting_for_host') {
                setupOverlay.style.display = 'flex';
                document.getElementById('actionArea').style.display = 'none'; 
                ['card1', 'card2', 'card3'].forEach(id => document.getElementById(id).classList.remove('flipped'));

                if (isHost) {
                    document.getElementById('setupTitle').innerText = state.pool === 0 ? "新的一局！請重新設定" : "你是室長，請設定規則";
                    document.getElementById('setupControls').style.display = 'block';
                } else {
                    document.getElementById('setupTitle').innerText = "等待室長設定規則⏳...";
                    document.getElementById('setupControls').style.display = 'none';
                }
            } else if (state.status === 'waiting_for_players') {
                setupOverlay.style.display = 'flex';
                document.getElementById('actionArea').style.display = 'none'; 
                document.getElementById('setupTitle').innerHTML = state.message + `<br><br><div style="color:var(--gold); font-size: 1.2em; border: 3px dashed var(--gold); padding: 15px 20px; border-radius: 15px; display: inline-block; letter-spacing: 5px; background: rgba(0,0,0,0.5);">包廂號碼：<br>${currentRoomId}</div>`;
                document.getElementById('setupControls').style.display = 'none';
            } else {
                setupOverlay.style.display = 'none';
            }

            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = state.message;
            msgEl.style.color = state.messageColor;
        });

        socket.on('shuffling_deck', () => {
            document.getElementById('shuffleOverlay').style.display = 'flex';
            sfx.shuffle();
            setTimeout(() => {
                document.getElementById('shuffleOverlay').style.display = 'none';
            }, 3000);
        });

        socket.on('auto_replenish', (state) => {
            updatePlayerList(state);
            document.getElementById('poolAmount').innerText = state.pool;
            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = state.message;
            msgEl.style.color = state.messageColor;

            sfx.coin(); 
            confetti({ particleCount: 150, spread: 100, origin: { y: 0 }, colors: ['#FFD700', '#F39C12', '#F1C40F'], zIndex: 9999 });
        });

        socket.on('cards_dealt', (state) => {
            updatePlayerList(state); 
            document.getElementById('poolAmount').innerText = state.pool;
            document.getElementById('cardsLeft').innerText = state.deck.length;

            ['card1', 'card2', 'card3'].forEach(id => document.getElementById(id).classList.remove('flipped'));
            
            setTimeout(() => {
                renderCard(state.tableCards.c1, 'c1-front');
                renderCard(state.tableCards.c2, 'c2-front');
                document.getElementById('c3-front').innerHTML = ''; 

                document.getElementById('card1').classList.add('flipped');
                sfx.card(); 

                setTimeout(() => {
                    document.getElementById('card2').classList.add('flipped');
                    sfx.card(); 
                }, 300);
            }, 300);

            setTimeout(() => {
                let msgEl = document.getElementById('resultMsg');
                msgEl.innerText = state.message;
                msgEl.style.color = state.messageColor;

                if (isMyTurn) {
                    let minBet = Math.min(state.pool, currentPassFee > 0 ? currentPassFee : 10);
                    let betInput = document.getElementById('betAmount');
                    betInput.value = '';
                    betInput.min = minBet;
                    betInput.placeholder = `至少 $${minBet}...`;

                    document.getElementById('actionArea').style.display = 'flex';
                    document.getElementById('normalAction').style.display = state.isPair ? 'none' : 'flex';
                    document.getElementById('pairAction').style.display = state.isPair ? 'flex' : 'none';
                }
            }, 1000);
        });

        socket.on('shoot_result', (data) => {
            document.getElementById('actionArea').style.display = 'none'; 
            
            updatePlayerList(data.state);
            document.getElementById('poolAmount').innerText = data.state.pool;

            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = data.state.message;
            msgEl.style.color = data.state.messageColor;

            renderCard(data.state.tableCards.c3, 'c3-front');
            document.getElementById('card3').classList.add('flipped');
            sfx.card(); 

            setTimeout(() => {
                if (data.state.message.includes('撞柱')) {
                    sfx.hit();
                } else if (data.resultType === 'win') {
                    sfx.win();
                    confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 }});
                } else {
                    sfx.lose();
                }
            }, 400); 
        });

        socket.on('game_ended', (data) => {
            document.getElementById('resultOverlay').style.display = 'flex';
            document.getElementById('finalPoolAmount').innerText = `已均分 (每人在線玩家 +$${data.distributedShare})`;
            
            let listHtml = '';
            data.leaderboard.forEach((p, index) => {
                let medal = '';
                if (index === 0) medal = '🥇';
                else if (index === 1) medal = '🥈';
                else if (index === 2) medal = '🥉';
                else medal = `[${index + 1}]`;
                
                let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                let pnlSign = p.pnl > 0 ? '+' : '';
                
                let isOffline = p.name.includes('(已離線)');
                let nameStyle = isOffline ? 'color: #777;' : '';
                
                listHtml += `
                <div class="leaderboard-item" style="${nameStyle}">
                    <span><span class="medal-icon">${medal}</span>${p.name}</span>
                    <span class="${pnlClass}">${pnlSign}${p.pnl}</span>
                </div>`;
            });
            
            document.getElementById('leaderboardList').innerHTML = listHtml;
            
            sfx.win(); 
            confetti({ particleCount: 400, spread: 150, origin: { y: 0.3 }, zIndex: 4000 });
        });

        function shoot(guessType) {
            let bet = parseInt(document.getElementById('betAmount').value);
            let currentPool = parseInt(document.getElementById('poolAmount').innerText);
            
            let minBet = Math.min(currentPool, currentPassFee > 0 ? currentPassFee : 10);
            
            if(isNaN(bet) || bet < minBet) return alert(`⚠️ 下注金額不能低於最低限制 ($${minBet})！`);
            if(bet > currentPool) return alert(`⚠️ 下注金額不能超過目前彩池 ($${currentPool})！`);
            
            socket.emit('shoot', { bet, guessType });
        }
        
        function passRound() { 
            socket.emit('pass'); 
        }
    </script>
</body>
</html>
