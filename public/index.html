<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIP 射龍門 🐉 百萬級俱樂部</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&display=swap" rel="stylesheet">
    <script src="/socket.io/socket.io.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <style>
        :root { 
            --gold: #d4af37; 
            --gold-glow: rgba(212, 175, 55, 0.4);
            --bg-dark: #090c15;
            --panel-bg: rgba(15, 23, 42, 0.65);
            --glass-border: rgba(255, 255, 255, 0.1);
            --win-green: #10b981;
            --lose-red: #ff4757;
        }
        
        * { box-sizing: border-box; }
        body { 
            font-family: 'Inter', 'Segoe UI', sans-serif; margin: 0; 
            background: radial-gradient(circle at 50% 0%, #1e293b 0%, var(--bg-dark) 100%);
            display: flex; height: 100vh; color: #f8fafc; position: relative; overflow: hidden;
        }
        
        /* 🏆 共用毛玻璃面板 */
        .glass-panel {
            background: var(--panel-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid var(--glass-border);
            border-radius: 24px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            padding: 40px;
        }

        /* 🏆 大廳 UI */
        #loginOverlay, #setupOverlay, #waitingOverlay, #resultOverlay { 
            position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; 
            background: radial-gradient(circle at center, rgba(15,23,42,0.9) 0%, rgba(9,12,21,0.98) 100%); 
            z-index: 1000; display: flex; flex-direction: column; align-items: center; justify-content: center; 
            overflow-y: auto; padding: 20px 0;
        }
        
        h1.title-gold { 
            font-size: 3.5em; color: transparent; background: linear-gradient(135deg, #FFDF00, #d4af37); 
            -webkit-background-clip: text; background-clip: text; text-shadow: 0 10px 30px var(--gold-glow); 
            margin-bottom: 30px; letter-spacing: 4px; font-weight: 800; text-align: center;
        }
        
        .input-group label { display: block; color: #94a3b8; margin-bottom: 8px; font-size: 0.9em; font-weight: 600; text-transform: uppercase; letter-spacing: 1px;}
        input[type="text"], input[type="number"] { 
            width: 100%; padding: 16px; font-size: 1.2em; border-radius: 12px; 
            border: 1px solid rgba(255,255,255,0.15); background: rgba(0,0,0,0.3); color: white; 
            outline: none; transition: all 0.3s ease; text-align: center; font-weight: 600;
        }
        input:focus { border-color: var(--gold); box-shadow: 0 0 20px var(--gold-glow); background: rgba(0,0,0,0.5);}
        
        button { 
            width: 100%; padding: 16px; font-size: 1.2em; border-radius: 12px; font-weight: 800; 
            border: none; cursor: pointer; transition: all 0.3s cubic-bezier(0.25, 0.8, 0.25, 1); letter-spacing: 1px;
        }
        .btn-primary { background: linear-gradient(135deg, #FFDF00, #d4af37); color: #000; box-shadow: 0 10px 20px rgba(212, 175, 55, 0.3); }
        .btn-primary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(212, 175, 55, 0.5); filter: brightness(1.1); }
        .btn-secondary { background: linear-gradient(135deg, #3b82f6, #2563eb); color: white; box-shadow: 0 10px 20px rgba(37, 99, 235, 0.3); }
        .btn-secondary:hover { transform: translateY(-3px); box-shadow: 0 15px 30px rgba(37, 99, 235, 0.5); }
        
        /* 🏆 VIP 等待大廳 UI */
        .waiting-room-code { 
            font-size: 3em; font-weight: 800; color: var(--gold); letter-spacing: 12px; 
            background: rgba(0,0,0,0.4); padding: 15px 30px; border-radius: 16px; border: 1px dashed var(--gold); 
            margin: 20px 0; text-align: center; text-transform: uppercase;
        }
        .players-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 15px; margin: 30px 0; width: 100%;
        }
        .player-slot { 
            background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); 
            border-radius: 12px; padding: 20px 10px; text-align: center; font-weight: 600; color: #cbd5e1;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 10px;
        }
        .player-slot.filled { background: rgba(212, 175, 55, 0.1); border-color: var(--gold); color: white; box-shadow: inset 0 0 20px rgba(212, 175, 55, 0.1);}
        .player-avatar { font-size: 2em; }

        /* 🏆 遊戲內 UI */
        .sidebar { 
            width: 320px; background: var(--panel-bg); backdrop-filter: blur(20px); border-right: 1px solid var(--glass-border); 
            padding: 25px; display: flex; flex-direction: column; box-shadow: 5px 0 30px rgba(0,0,0,0.5); z-index: 10;
        }
        .room-tag { 
            background: rgba(0,0,0,0.3); border: 1px solid var(--glass-border); color: #94a3b8; 
            padding: 10px; border-radius: 12px; font-size: 1.1em; text-align: center; margin-bottom: 25px; font-weight: 600;
        }
        .room-tag span { color: var(--gold); letter-spacing: 3px; font-weight: 800;}
        .player-list { flex-grow: 1; overflow-y: auto; padding-right: 10px; }
        .player-list::-webkit-scrollbar { width: 6px; }
        .player-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.2); border-radius: 10px; }
        
        .player-item { 
            display: flex; align-items: center; justify-content: space-between; padding: 16px 15px; 
            border-bottom: 1px solid rgba(255,255,255,0.05); font-size: 1.1em; font-weight: 600; transition: 0.3s; border-radius: 8px; margin-bottom: 5px;
        }
        .active-turn { background: linear-gradient(90deg, rgba(212,175,55,0.2) 0%, transparent 100%); border-left: 4px solid var(--gold); border-bottom: none;}
        .pnl-positive { color: var(--win-green); text-shadow: 0 0 10px rgba(16,185,129,0.4); }
        .pnl-negative { color: var(--lose-red); text-shadow: 0 0 10px rgba(255,71,87,0.4); }

        .main-game { flex-grow: 1; padding: 30px; display: flex; flex-direction: column; justify-content: space-between; align-items: center; position: relative;}
        
        .top-action-bar { position: absolute; top: 20px; right: 30px; display: flex; gap: 15px; z-index: 50; }
        .top-btn { 
            background: rgba(0,0,0,0.5); border: 1px solid var(--glass-border); color: white; padding: 10px 20px; 
            border-radius: 30px; font-size: 0.9em; cursor: pointer; transition: 0.3s; backdrop-filter: blur(10px);
        }
        .top-btn:hover { background: rgba(255,255,255,0.1); border-color: white;}
        .btn-danger-outline { color: var(--lose-red); border-color: rgba(255,71,87,0.3); }

        /* 牌桌設計 */
        .casino-table { 
            width: 100%; max-width: 1000px; flex-grow: 1; margin-top: 50px;
            background: radial-gradient(ellipse at center, #0f3d24 0%, #061c0e 100%); 
            border-radius: 150px; box-shadow: inset 0 0 80px rgba(0,0,0,0.8), 0 20px 50px rgba(0,0,0,0.5), 0 0 0 12px #271f1a; 
            display: flex; flex-direction: column; justify-content: center; align-items: center; position: relative; padding: 40px;
        }
        
        .table-info { display: flex; gap: 40px; position: absolute; top: 60px; width: 100%; justify-content: center;}
        .info-box { text-align: center; }
        .info-label { color: rgba(255,255,255,0.5); font-size: 0.9em; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 5px;}
        .info-val { font-size: 3.5em; color: var(--gold); font-weight: 800; text-shadow: 0 5px 15px rgba(0,0,0,0.5); }
        
        /* 真實撲克牌 */
        .center-board { display: flex; justify-content: center; gap: 30px; perspective: 1200px; margin-top: 20px;}
        .card { width: 130px; height: 190px; position: relative; transform-style: preserve-3d; transition: transform 0.6s cubic-bezier(0.4, 0.0, 0.2, 1); border-radius: 12px; box-shadow: 0 15px 35px rgba(0,0,0,0.6); }
        .card.flipped { transform: rotateY(180deg) scale(1.05); }
        .card-face { width: 100%; height: 100%; position: absolute; backface-visibility: hidden; border-radius: 12px; }
        .card-back { 
            background: repeating-linear-gradient(45deg, #1e3a8a, #1e3a8a 10px, #1e40af 10px, #1e40af 20px); 
            border: 5px solid white; transform: rotateY(0deg); box-shadow: inset 0 0 10px rgba(0,0,0,0.5);
        }
        .card-front { 
            transform: rotateY(180deg); background: linear-gradient(135deg, #ffffff 0%, #f1f5f9 100%); 
            border: 1px solid #e2e8f0; color: #0f172a; display: flex; flex-direction: column; padding: 8px;
        }
        .red-suit { color: #e11d48; }
        .card-corner { position: absolute; top: 8px; left: 10px; display: flex; flex-direction: column; align-items: center; line-height: 1; }
        .card-corner-val { font-size: 28px; font-weight: 800; }
        .card-corner-suit { font-size: 20px; margin-top: 2px; }
        .card-suit { font-size: 65px; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); opacity: 0.9;}

        /* 操作區 */
        .bottom-panel { 
            width: 100%; max-width: 800px; background: var(--panel-bg); backdrop-filter: blur(20px); 
            border: 1px solid var(--glass-border); border-radius: 24px; padding: 30px; text-align: center; 
            box-shadow: 0 -10px 40px rgba(0,0,0,0.3); z-index: 20;
        }
        #resultMsg { font-size: 1.8em; font-weight: 800; margin-bottom: 20px; letter-spacing: 1px;}
        .controls { display: flex; gap: 15px; justify-content: center; align-items: center; }
        .action-input { width: 180px; padding: 15px; font-size: 1.5em; border-radius: 12px; border: 2px solid var(--gold); background: rgba(0,0,0,0.5); color: var(--gold); text-align: center; font-weight: bold; outline: none; transition: 0.3s;}
        .action-input:focus { box-shadow: 0 0 20px var(--gold-glow); }
        .btn-shoot { background: linear-gradient(135deg, #10b981, #059669); color: white; width: auto; padding: 15px 40px;}
        .btn-shoot:hover { box-shadow: 0 10px 20px rgba(16,185,129,0.4); }
        .btn-pass { background: linear-gradient(135deg, #64748b, #475569); color: white; width: auto; padding: 15px 40px;}
        .btn-pass:hover { box-shadow: 0 10px 20px rgba(100,116,139,0.4); }

        /* 洗牌動畫 */
        #shuffleOverlay { position: absolute; top:0; left:0; width:100vw; height:100vh; background:rgba(9,12,21,0.95); z-index:4000; display:none; flex-direction:column; justify-content:center; align-items:center; backdrop-filter: blur(10px);}
        .shuffle-icon { font-size: 8em; animation: float 2s ease-in-out infinite; filter: drop-shadow(0 0 30px rgba(255,255,255,0.2));}
        @keyframes float { 0% { transform: translateY(0px) rotate(0deg); } 50% { transform: translateY(-20px) rotate(10deg); } 100% { transform: translateY(0px) rotate(0deg); } }

        /* 手機版 RWD */
        @media (max-width: 768px) {
            body { flex-direction: column; overflow-y: auto; }
            .glass-panel { width: 92%; padding: 25px 20px; }
            h1.title-gold { font-size: 2.5em; letter-spacing: 2px; }
            .waiting-room-code { font-size: 2.2em; padding: 10px; }
            
            .top-action-bar { top: 10px; right: 10px; left: 10px; justify-content: space-between; gap: 5px; }
            .top-btn { padding: 8px 12px; font-size: 0.8em; }

            .sidebar { width: 100%; height: auto; border-right: none; border-bottom: 1px solid var(--glass-border); padding: 15px 15px 5px 15px; margin-top: 50px; }
            .room-tag { margin-bottom: 10px; padding: 8px; font-size: 1em; }
            .player-list { max-height: 180px; display: flex; flex-direction: column; gap: 5px;}
            .player-item { font-size: 1em; padding: 10px; }
            
            .main-game { padding: 15px; justify-content: flex-start; }
            .casino-table { border-radius: 40px; padding: 15px; margin-top: 10px; height: 320px; box-shadow: inset 0 0 40px rgba(0,0,0,0.8), 0 0 0 8px #271f1a;}
            .table-info { top: 25px; gap: 20px; }
            .info-val { font-size: 2em; }
            
            .center-board { gap: 15px; margin-top: 60px;}
            .card { width: 80px; height: 115px; }
            .card-corner-val { font-size: 18px; }
            .card-corner-suit { font-size: 14px; }
            .card-suit { font-size: 40px; }
            #card3 { margin-top: -20px !important; }

            .bottom-panel { padding: 15px; margin-top: 15px; }
            #resultMsg { font-size: 1.2em; margin-bottom: 10px; }
            .controls { flex-direction: column; width: 100%; gap: 10px;}
            .action-input { width: 100%; font-size: 1.2em; padding: 12px; }
            #normalAction, #pairAction { width: 100%; display: flex; gap: 10px; }
            .btn-shoot, .btn-pass, .btn-danger { flex: 1; padding: 12px; font-size: 1em; }
        }
    </style>
</head>
<body>

    <div class="top-action-bar" id="gameActionBar" style="display:none;">
        <button class="top-btn btn-danger-outline" id="hostResetBtn" onclick="forceReset()" style="display:none;">🛑 重置牌桌</button>
        <button class="top-btn" id="endGameBtn" onclick="endGame()" style="display:none;">🏆 結算排行榜</button>
    </div>

    <div id="loginOverlay">
        <div class="glass-panel" style="max-width: 450px; width: 90%;">
            <h1 class="title-gold">VIP 俱樂部</h1>
            <div class="input-group">
                <label>身份登記 (玩家暱稱)</label>
                <input type="text" id="playerName" placeholder="例如：高進" maxlength="10">
            </div>
            <button class="btn-primary" onclick="createRoom()" style="margin-bottom: 20px;">💎 開設尊爵包廂</button>
            <div class="divider-text">或者</div>
            <div class="input-group" style="margin-top: 20px;">
                <label>受邀入場 (4碼房號)</label>
                <input type="text" id="roomCodeInput" placeholder="輸入邀請碼" maxlength="4" style="text-transform: uppercase; letter-spacing: 8px;">
            </div>
            <button class="btn-secondary" onclick="joinRoom()">🚪 進入包廂</button>
        </div>
    </div>

    <div id="waitingOverlay" style="display:none;">
        <div class="glass-panel" style="max-width: 600px; width: 95%; text-align: center;">
            <h2 style="color: #94a3b8; font-weight: 600; letter-spacing: 2px; margin-top: 0;">包廂準備中</h2>
            <div class="waiting-room-code" id="waitingRoomCodeDisplay">----</div>
            <p style="color: #cbd5e1; margin-bottom: 5px;">請將房號分享給朋友加入</p>
            <div style="color: var(--gold); font-weight: bold; margin-bottom: 20px;">已入座：<span id="waitingCount">0</span> / <span id="waitingMax">0</span></div>
            
            <div class="players-grid" id="waitingPlayersGrid">
                </div>

            <div id="hostWaitingAction" style="display:none; margin-top: 30px;">
                <button class="btn-primary" onclick="forceStart()">🚀 提前發牌 (強制開局)</button>
                <p style="color: #64748b; font-size: 0.85em; margin-top: 10px;">至少需要 2 人即可開局，總底池將按實際人數計算。</p>
            </div>
            <div id="guestWaitingAction" style="display:none; margin-top: 30px; color: #94a3b8; font-weight: 600; padding: 15px; background: rgba(0,0,0,0.3); border-radius: 12px;">
                ⏳ 等待室長確認開局...
            </div>
        </div>
    </div>

    <div id="setupOverlay" style="display:none;">
        <div class="glass-panel" style="max-width: 400px; width: 90%;">
            <h2 style="color: white; text-align: center; margin-top:0; margin-bottom: 25px;">包廂規則設定</h2>
            <div class="setup-group">
                <label>座位數 (最大人數)：</label>
                <input type="number" id="maxPlayersInput" value="4" min="2" step="1">
            </div>
            <div class="setup-group">
                <label>每人投注底池 ($)：</label>
                <input type="number" id="poolPerPlayerInput" value="500" min="50" step="50">
            </div>
            <div class="setup-group">
                <label>PASS 過路費 ($)：</label>
                <input type="number" id="passFeeInput" value="50" min="0" step="10">
            </div>
            <div class="setup-group">
                <label>使用幾副牌：</label>
                <input type="number" id="decksInput" value="2" min="1" max="5" step="1">
            </div>
            <button class="btn-primary" style="margin-top: 20px;" onclick="setPool()">確認設定</button>
        </div>
    </div>

    <div id="shuffleOverlay">
        <div class="shuffle-icon">🃏</div>
        <h2 style="color:var(--gold); margin-top:30px; font-size: 1.8em; letter-spacing: 2px;">牌靴見底<br>荷官重新洗牌中...</h2>
    </div>

    <div id="resultOverlay" style="display:none;">
        <div class="glass-panel" style="max-width: 600px; width: 95%; max-height: 85vh; display:flex; flex-direction:column;">
            <h1 class="title-gold" style="font-size: 2.5em; margin-bottom: 10px;">🏆 終局結算</h1>
            <h3 style="color: #94a3b8; text-align: center; margin-top: 0; margin-bottom: 25px;">剩餘彩池：<span style="color:var(--gold);">已均分 (每人在線玩家 +$<span id="finalPoolAmount">0</span>)</span></h3>
            <div class="player-list" id="leaderboardList" style="flex-grow: 1; overflow-y: auto; padding-right: 5px;"></div>
            <button class="btn-secondary" onclick="closeResult()" style="margin-top: 25px;">關閉面板</button>
        </div>
    </div>

    <div class="sidebar" id="mainSidebar" style="display:none;">
        <div class="room-tag">包廂：<span id="displayRoomId">----</span></div>
        <div class="player-list" id="playerList"></div>
    </div>

    <div class="main-game" id="mainGameArea" style="display:none;">
        <div class="casino-table">
            <div class="table-info">
                <div class="info-box">
                    <div class="info-label">Total Pool</div>
                    <div class="info-val">$<span id="poolAmount">0</span></div>
                </div>
                <div class="info-box">
                    <div class="info-label">Cards</div>
                    <div class="info-val" style="color: #cbd5e1;"><span id="cardsLeft">0</span></div>
                </div>
            </div>

            <div class="center-board">
                <div class="card" id="card1"><div class="card-face card-back"></div><div class="card-face card-front" id="c1-front"></div></div>
                <div class="card" id="card3" style="margin-top:-40px; z-index: 5;"><div class="card-face card-back"></div><div class="card-face card-front" id="c3-front"></div></div>
                <div class="card" id="card2"><div class="card-face card-back"></div><div class="card-face card-front" id="c2-front"></div></div>
            </div>
        </div>

        <div class="bottom-panel">
            <div id="resultMsg">等待發牌...</div>
            
            <div class="controls" id="actionArea" style="display:none;">
                <input type="number" id="betAmount" class="action-input" placeholder="下注...">
                <div id="normalAction" style="display:flex; gap:10px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn-shoot" onclick="shoot('normal')">🚀 射門</button>
                    <button class="btn-pass" onclick="passRound()">💨 PASS</button>
                </div>
                <div id="pairAction" style="display:none; gap:10px; flex-wrap: wrap; justify-content: center;">
                    <button class="btn-danger" style="background: linear-gradient(135deg, #ef4444, #be123c);" onclick="shoot('high')">🔼 猜大</button>
                    <button class="btn-danger" style="background: linear-gradient(135deg, #3b82f6, #1d4ed8);" onclick="shoot('low')">🔽 猜小</button>
                    <button class="btn-pass" onclick="passRound()">💨 PASS</button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const socket = io();
        let myName = "";
        let isMyTurn = false;
        let currentRoomId = "";
        let currentPassFee = 0; 
        let isImHost = false;

        // 音效引擎保持不變
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) { try { const AudioContext = window.AudioContext || window.webkitAudioContext; if(AudioContext) audioCtx = new AudioContext(); } catch(e) {} }
            return audioCtx;
        }
        function unlockAudio() {
            const ctx = getAudioContext();
            if(!ctx) return;
            if (ctx.state === 'suspended') ctx.resume();
            try { const buffer = ctx.createBuffer(1, 1, 22050); const source = ctx.createBufferSource(); source.buffer = buffer; source.connect(ctx.destination); source.start(0); } catch(e){}
        }
        ['touchstart', 'touchend', 'click', 'keydown'].forEach(evt => { document.body.addEventListener(evt, unlockAudio, { capture: true }); });

        function playTone(freq, type, duration, vol=0.1) {
            const ctx = getAudioContext();
            if(!ctx || ctx.state !== 'running') return;
            try {
                const osc = ctx.createOscillator(); const gain = ctx.createGain();
                osc.type = type; osc.frequency.setValueAtTime(freq, ctx.currentTime);
                gain.gain.setValueAtTime(vol, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + duration);
                osc.connect(gain); gain.connect(ctx.destination); osc.start(); osc.stop(ctx.currentTime + duration);
            } catch(e) {}
        }

        const sfx = {
            card: () => playTone(400, 'square', 0.1, 0.03),
            win: () => { playTone(440, 'sine', 0.1, 0.1); setTimeout(()=>playTone(554, 'sine', 0.1, 0.1), 100); setTimeout(()=>playTone(659, 'sine', 0.3, 0.1), 200); }, 
            lose: () => { playTone(300, 'sawtooth', 0.2, 0.1); setTimeout(()=>playTone(280, 'sawtooth', 0.2, 0.1), 200); setTimeout(()=>playTone(260, 'sawtooth', 0.4, 0.1), 400); }, 
            hit: () => { playTone(150, 'square', 0.3, 0.2); setTimeout(()=>playTone(100, 'square', 0.5, 0.2), 150); },
            coin: () => { playTone(1200, 'sine', 0.1, 0.1); setTimeout(()=>playTone(1600, 'sine', 0.3, 0.1), 100); },
            shuffle: () => { for(let i=0; i<15; i++) setTimeout(() => playTone(600 + Math.random()*400, 'triangle', 0.05, 0.03), i*60); }
        };

        function getPlayerName() { let name = document.getElementById('playerName').value.trim(); if (!name) alert("請輸入暱稱！"); return name; }
        
        function createRoom() {
            myName = getPlayerName();
            if (!myName) return;
            socket.emit('create_room', myName);
        }

        function joinRoom() {
            myName = getPlayerName();
            if (!myName) return;
            let roomId = document.getElementById('roomCodeInput').value.trim();
            if (roomId.length !== 4) return alert("請輸入 4 碼包廂號！");
            socket.emit('join_room', { playerName: myName, roomId: roomId });
        }

        socket.on('room_joined', (roomId) => {
            currentRoomId = roomId;
            document.getElementById('displayRoomId').innerText = roomId;
            document.getElementById('waitingRoomCodeDisplay').innerText = roomId;
            document.getElementById('loginOverlay').style.display = 'none';
            // 顯示主遊戲外框，但會被各個 Overlay 蓋住
            document.getElementById('mainSidebar').style.display = 'flex';
            document.getElementById('mainGameArea').style.display = 'flex';
            document.getElementById('gameActionBar').style.display = 'flex';
        });

        socket.on('error_msg', (msg) => { alert(msg); });

        function setPool() {
            let poolPerPlayer = parseInt(document.getElementById('poolPerPlayerInput').value);
            let passFee = parseInt(document.getElementById('passFeeInput').value);
            let maxPlayers = parseInt(document.getElementById('maxPlayersInput').value);
            let decks = parseInt(document.getElementById('decksInput').value);
            if(isNaN(poolPerPlayer) || poolPerPlayer <= 0) return alert("底池金額無效！");
            if(isNaN(maxPlayers) || maxPlayers < 2) return alert("遊戲至少需要 2 人！");
            if(isNaN(passFee) || passFee < 0) passFee = 0;
            if(isNaN(decks) || decks < 1 || decks > 5) return alert("牌數請設定在 1 到 5 副之間！");
            socket.emit('set_pool', { poolPerPlayer, passFee, maxPlayers, decks });
        }

        // 🚀 新增：室長發送強制開始指令 🚀
        function forceStart() {
            socket.emit('force_start');
        }

        function forceReset() { if(confirm("確定要強制中斷目前牌局，並讓所有人重新設定嗎？")) socket.emit('force_reset'); }
        function endGame() { if(confirm("確定要終止牌局，並結算剩餘彩池嗎？(離線玩家也會列入結算)")) socket.emit('end_game'); }
        function closeResult() { document.getElementById('resultOverlay').style.display = 'none'; }

        function renderCard(cardObj, elementId) {
            if (!cardObj) return;
            const colorClass = (cardObj.suit === '♥' || cardObj.suit === '♦') ? 'red-suit' : '';
            const faces = {1:'A', 11:'J', 12:'Q', 13:'K'};
            const displayVal = faces[cardObj.value] || cardObj.value;
            document.getElementById(elementId).innerHTML = `
                <div class="card-corner ${colorClass}">
                    <div class="card-corner-val">${displayVal}</div>
                    <div class="card-corner-suit">${cardObj.suit}</div>
                </div>
                <div class="card-suit ${colorClass}">${cardObj.suit}</div>
            `;
        }

        function updatePlayerList(state) {
            let listHtml = '';
            state.playerOrder.forEach((id, index) => {
                let p = state.players[id];
                let isCurrentTurn = (index === state.currentTurnIndex && state.status === 'playing');
                let rowClass = isCurrentTurn ? 'player-item active-turn' : 'player-item';
                let turnMarker = isCurrentTurn ? '👉 ' : '';
                let hostMarker = p.isHost ? '👑 ' : '';
                let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                let pnlSign = p.pnl > 0 ? '+' : '';
                listHtml += `<div class="${rowClass}"><span>${turnMarker}${hostMarker}${p.name} ${id === socket.id ? '(你)' : ''}</span><span class="${pnlClass}">${pnlSign}${p.pnl}</span></div>`;
            });

            for(let id in state.players) {
                if(state.players[id].isWaiting) {
                    let p = state.players[id];
                    let hostMarker = p.isHost ? '👑 ' : '';
                    let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                    let pnlSign = p.pnl > 0 ? '+' : '';
                    listHtml += `<div class="player-item" style="opacity: 0.5;"><span>⏳ ${hostMarker}${p.name} ${id === socket.id ? '(你)' : ''} <span style="font-size:0.8em">(等入局)</span></span><span class="${pnlClass}">${pnlSign}${p.pnl}</span></div>`;
                }
            }

            if(state.offlinePlayers && state.offlinePlayers.length > 0) {
                listHtml += `<div style="text-align:center; color:#64748b; margin: 20px 0 10px 0; font-size:0.85em; font-weight:bold; letter-spacing: 2px;">💤 離線暫存區</div>`;
                state.offlinePlayers.forEach(p => {
                    let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                    let pnlSign = p.pnl > 0 ? '+' : '';
                    listHtml += `<div class="player-item" style="color: #64748b; font-style: italic;"><span>🔌 ${p.name}</span><span class="${pnlClass}">${pnlSign}${p.pnl}</span></div>`;
                });
            }

            document.getElementById('playerList').innerHTML = listHtml;
            isMyTurn = (state.playerOrder[state.currentTurnIndex] === socket.id);
        }

        // 🚀 渲染 VIP 等待大廳的名單 🚀
        function renderWaitingRoom(state) {
            let currentCount = Object.keys(state.players).length;
            document.getElementById('waitingCount').innerText = currentCount;
            document.getElementById('waitingMax').innerText = state.maxPlayers;
            
            let gridHtml = '';
            let playerList = Object.values(state.players);
            
            // 畫出已經加入的玩家
            for(let i=0; i<playerList.length; i++) {
                let p = playerList[i];
                let hostIcon = p.isHost ? '👑 ' : '👤 ';
                let meTag = p.name === myName ? '<br><span style="font-size:0.8em; color:var(--gold);">(你)</span>' : '';
                gridHtml += `<div class="player-slot filled"><div class="player-avatar">${hostIcon}</div><div>${p.name}${meTag}</div></div>`;
            }
            // 畫出剩下的空位
            let emptySlots = state.maxPlayers - currentCount;
            for(let i=0; i<emptySlots; i++) {
                gridHtml += `<div class="player-slot"><div class="player-avatar" style="opacity:0.3">🪑</div><div>等待加入...</div></div>`;
            }
            document.getElementById('waitingPlayersGrid').innerHTML = gridHtml;
        }

        socket.on('update_state', (state) => {
            currentPassFee = state.passFee; 
            document.getElementById('poolAmount').innerText = state.pool;
            document.getElementById('cardsLeft').innerText = state.deck.length;
            updatePlayerList(state);

            let passButtons = document.querySelectorAll('.btn-pass');
            passButtons.forEach(btn => { btn.innerText = state.passFee > 0 ? `💨 PASS (-$${state.passFee})` : `💨 PASS`; });

            isImHost = (state.players[socket.id] && state.players[socket.id].isHost);
            document.getElementById('hostResetBtn').style.display = isImHost ? 'block' : 'none';
            document.getElementById('endGameBtn').style.display = (isImHost && state.status === 'playing') ? 'block' : 'none';

            let setupOverlay = document.getElementById('setupOverlay');
            let waitingOverlay = document.getElementById('waitingOverlay');
            
            if (state.status === 'waiting_for_host') {
                setupOverlay.style.display = 'flex';
                waitingOverlay.style.display = 'none';
                document.getElementById('actionArea').style.display = 'none'; 
                ['card1', 'card2', 'card3'].forEach(id => document.getElementById(id).classList.remove('flipped'));

                if (isImHost) {
                    document.getElementById('setupTitle').innerText = state.pool === 0 ? "設定新局" : "室長規則設定";
                    document.getElementById('setupControls').style.display = 'block';
                } else {
                    document.getElementById('setupTitle').innerText = "等待室長設定規則⏳...";
                    document.getElementById('setupControls').style.display = 'none';
                }
            } else if (state.status === 'waiting_for_players') {
                setupOverlay.style.display = 'none';
                waitingOverlay.style.display = 'flex';
                document.getElementById('actionArea').style.display = 'none'; 
                
                renderWaitingRoom(state);

                if(isImHost) {
                    document.getElementById('hostWaitingAction').style.display = 'block';
                    document.getElementById('guestWaitingAction').style.display = 'none';
                } else {
                    document.getElementById('hostWaitingAction').style.display = 'none';
                    document.getElementById('guestWaitingAction').style.display = 'block';
                }
            } else {
                setupOverlay.style.display = 'none';
                waitingOverlay.style.display = 'none';
            }

            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = state.message;
            msgEl.style.color = state.messageColor;
        });

        socket.on('shuffling_deck', () => {
            document.getElementById('shuffleOverlay').style.display = 'flex';
            sfx.shuffle();
            setTimeout(() => { document.getElementById('shuffleOverlay').style.display = 'none'; }, 3000);
        });

        socket.on('auto_replenish', (state) => {
            updatePlayerList(state);
            document.getElementById('poolAmount').innerText = state.pool;
            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = state.message; msgEl.style.color = state.messageColor;
            sfx.coin(); 
            confetti({ particleCount: 200, spread: 120, origin: { y: 0.1 }, colors: ['#FFD700', '#F39C12', '#F1C40F', '#10b981'], zIndex: 9999 });
        });

        socket.on('cards_dealt', (state) => {
            updatePlayerList(state); 
            document.getElementById('poolAmount').innerText = state.pool;
            document.getElementById('cardsLeft').innerText = state.deck.length;

            ['card1', 'card2', 'card3'].forEach(id => document.getElementById(id).classList.remove('flipped'));
            
            setTimeout(() => {
                renderCard(state.tableCards.c1, 'c1-front');
                renderCard(state.tableCards.c2, 'c2-front');
                document.getElementById('c3-front').innerHTML = ''; 

                document.getElementById('card1').classList.add('flipped');
                sfx.card(); 

                setTimeout(() => {
                    document.getElementById('card2').classList.add('flipped');
                    sfx.card(); 
                }, 300);
            }, 300);

            setTimeout(() => {
                let msgEl = document.getElementById('resultMsg');
                msgEl.innerText = state.message; msgEl.style.color = state.messageColor;

                if (isMyTurn) {
                    let minBet = Math.min(state.pool, currentPassFee > 0 ? currentPassFee : 10);
                    let betInput = document.getElementById('betAmount');
                    betInput.value = ''; betInput.min = minBet; betInput.placeholder = `最低 $${minBet}...`;

                    document.getElementById('actionArea').style.display = 'flex';
                    document.getElementById('normalAction').style.display = state.isPair ? 'none' : 'flex';
                    document.getElementById('pairAction').style.display = state.isPair ? 'flex' : 'none';
                }
            }, 1000);
        });

        socket.on('shoot_result', (data) => {
            document.getElementById('actionArea').style.display = 'none'; 
            updatePlayerList(data.state);
            document.getElementById('poolAmount').innerText = data.state.pool;

            let msgEl = document.getElementById('resultMsg');
            msgEl.innerText = data.state.message; msgEl.style.color = data.state.messageColor;

            renderCard(data.state.tableCards.c3, 'c3-front');
            document.getElementById('card3').classList.add('flipped');
            sfx.card(); 

            setTimeout(() => {
                if (data.state.message.includes('撞柱')) { sfx.hit(); } 
                else if (data.resultType === 'win') { sfx.win(); confetti({ particleCount: 150, spread: 80, origin: { y: 0.5 }, colors: ['#10b981', '#FFD700', '#ffffff']}); } 
                else { sfx.lose(); }
            }, 400); 
        });

        socket.on('game_ended', (data) => {
            document.getElementById('resultOverlay').style.display = 'flex';
            document.getElementById('finalPoolAmount').innerText = data.distributedShare;
            
            let listHtml = '';
            data.leaderboard.forEach((p, index) => {
                let medal = '';
                if (index === 0) medal = '🥇'; else if (index === 1) medal = '🥈'; else if (index === 2) medal = '🥉'; else medal = `<span style="font-size:0.6em; color:#64748b;">${index + 1}</span>`;
                
                let pnlClass = p.pnl > 0 ? 'pnl-positive' : (p.pnl < 0 ? 'pnl-negative' : '');
                let pnlSign = p.pnl > 0 ? '+' : '';
                let isOffline = p.name.includes('(已離線)');
                let nameStyle = isOffline ? 'color: #64748b; font-style: italic;' : 'color: white;';
                
                listHtml += `
                <div class="player-item" style="${nameStyle} border-bottom: 1px solid rgba(255,255,255,0.05); padding: 15px;">
                    <span style="display:flex; align-items:center;"><span style="width:30px; text-align:center; margin-right:10px;">${medal}</span>${p.name}</span>
                    <span class="${pnlClass}" style="font-weight:bold;">${pnlSign}${p.pnl}</span>
                </div>`;
            });
            document.getElementById('leaderboardList').innerHTML = listHtml;
            sfx.win(); 
            confetti({ particleCount: 400, spread: 150, origin: { y: 0.3 }, zIndex: 4000 });
        });

        function shoot(guessType) {
            let bet = parseInt(document.getElementById('betAmount').value);
            let currentPool = parseInt(document.getElementById('poolAmount').innerText);
            let minBet = Math.min(currentPool, currentPassFee > 0 ? currentPassFee : 10);
            
            if(isNaN(bet) || bet < minBet) return alert(`⚠️ 下注不能低於最低限制 ($${minBet})！`);
            if(bet > currentPool) return alert(`⚠️ 籌碼不能超過目前總彩池 ($${currentPool})！`);
            socket.emit('shoot', { bet, guessType });
        }
        
        function passRound() { socket.emit('pass'); }
    </script>
</body>
</html>
